version: '3.8'

# 开发版本的 Docker Compose 配置
# 使用本地构建而不是 Docker Hub 镜像
# 用法: docker-compose -f docker-compose.dev.yml up -d

services:
  cobalt-api:
    image: wizdy/cobalt-api:latest
    container_name: cobalt-api-dev
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=development
      - API_URL=http://localhost:9000
      - CORS_URL=http://localhost:3000
      - CORS_WILDCARD=0
      - RATELIMIT_WINDOW=60
      - RATELIMIT_MAX=50
      - DURATION_LIMIT=10800
    restart: unless-stopped
    labels:
      - coolify.managed=false

  cobalt-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - WEB_DEFAULT_API=http://localhost:9000
        - WEB_HOST=localhost:3000
        # - WEB_PLAUSIBLE_HOST=  # 开发环境一般不需要分析
    container_name: cobalt-web-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - SERVICE_FQDN_COBALTWEB_3000=localhost:3000
      - SERVICE_URL_COBALTWEB=http://localhost:3000
    depends_on:
      - cobalt-api
    restart: unless-stopped
    labels:
      - coolify.managed=false

