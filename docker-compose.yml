version: '3.8'

services:
  cobalt-api:
    image: wizdy/cobalt-api:latest
    container_name: cobalt-api
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=production
      - API_URL=https://download.cohook.com
      - SERVICE_FQDN_COBALT_API_9000=download.cohook.com
      - CORS_URL=https://cobalt.cohook.com
      - CORS_WILDCARD=0
      - RATELIMIT_WINDOW=60
      - RATELIMIT_MAX=20
      - DURATION_LIMIT=10800
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/api/serverInfo", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - coolify.managed=true
      - traefik.enable=true
      - "traefik.http.routers.cobalt-api.rule=Host(`download.cohook.com`)"
      - "traefik.http.routers.cobalt-api.entryPoints=http"
      - "traefik.http.services.cobalt-api.loadbalancer.server.port=9000"

  cobalt-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - WEB_DEFAULT_API=https://download.cohook.com
        - WEB_HOST=cobalt.cohook.com
    container_name: cobalt-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SERVICE_FQDN_COBALT_WEB_3000=cobalt.cohook.com
    depends_on:
      - cobalt-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - coolify.managed=true
      - traefik.enable=true
      - "traefik.http.routers.cobalt-web.rule=Host(`cobalt.cohook.com`)"
      - "traefik.http.routers.cobalt-web.entryPoints=http"
      - "traefik.http.services.cobalt-web.loadbalancer.server.port=3000"