version: '3.8'

services:
  cobalt-api:
    image: wizdy/cobalt-api:latest
    container_name: cobalt-api
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=production
      - API_URL=${API_URL:-http://localhost:9000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/api/serverInfo", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s